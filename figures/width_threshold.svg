<text class="m" x="56" y="194.0" text-anchor="end">50%</text>
<line class="g" x1="64" x2="696" y1="107.0" y2="107.0"/>
<text class="m" x="56" y="111.0" text-anchor="end">75%</text>
<line class="g" x1="64" x2="696" y1="24" y2="24"/>
<text class="m" x="56" y="28" text-anchor="end">100%</text>
<text class="m" x="134.22222222222229" y="376" text-anchor="middle">0.8</text>
<text class="m" x="274.66666666666663" y="376" text-anchor="middle">1.0</text>
<text class="m" x="415.11111111111103" y="376" text-anchor="middle">1.2</text>
<text class="m" x="555.5555555555554" y="376" text-anchor="middle">1.4</text>
<text class="m" x="696.0" y="376" text-anchor="middle">1.6</text>
<line x1="274.66666666666663" x2="274.66666666666663" y1="24" y2="356" stroke="var(--mut)" stroke-dasharray="4 4"/>
<text class="m" x="280.66666666666663" y="36">width = p²</text>
<line class="ax" x1="64" x2="696" y1="356" y2="356"/>
<text x="380.0" y="406" text-anchor="middle">hidden width / p²</text>
<text transform="translate(16 190.0) rotate(-90)" text-anchor="middle">seeds that grok</text>
<g class="s7"><path class="ln" d="M145.7,356.0 L260.3,190.0 L375.0,24.0 L489.6,24.0"/>
<circle class="pt" cx="145.7" cy="356.0" r="4.6"><title>p=7, width 40: 0/2 seeds grok</title></circle>
