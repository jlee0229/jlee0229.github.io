# Builds writing/*/index.md into HTML and commits the result, so GitHub Pages
# keeps serving the branch as it does now (no Pages settings change needed).
#
# Runs on every push to main that touches a post or the build script.
# To import from Substack: Actions tab > "Build site" > Run workflow, paste the post URL.
name: Build site

on:
  push:
    branches: [main]
    paths: ["writing/**", "build.py", "requirements.txt", "index.html"]
  workflow_dispatch:
    inputs:
      substack_url:
        description: "Substack post URL to import (leave empty to just rebuild)"
        required: false
        default: ""
      draft:
        description: "Import as a draft (not published until you rename the folder)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Import from Substack
        if: ${{ inputs.substack_url != '' }}
        env:
          URL: ${{ inputs.substack_url }}
          DRAFT: ${{ inputs.draft && '--draft' || '' }}
        run: python tools/import_substack.py "$URL" $DRAFT
      - run: python tools/test_import.py
      - run: python build.py
      - name: Commit the built pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A writing index.html feed.xml cosets-vs-irreps
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Build site"
          git push
